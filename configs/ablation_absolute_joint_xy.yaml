defaults:
- ours
- _self_

output:
  project_name: ablation_absolute_joint_xy
data:
  hand_root: outputs/representation_ablation/hands_${data.representation} # keep the absolute-XY cache separate from wrist-relative caches
  representation: absolute_joint_xy
  hand_mean_path: outputs/representation_ablation/hand_mean.json
preprocess:
  ragged_to_canonical:
    representation: ${data.representation}
dataset:
  hand_loader:
    reader:
      representation: ${data.representation}
    transform:
      wrist_mean_path: ${data.hand_mean_path}
      training_split: ${data.splits.train}
