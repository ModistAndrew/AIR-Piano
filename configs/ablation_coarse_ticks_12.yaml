defaults:
  - default
  - _self_

output:
  project_name: airpiano_coarse_ticks_12

dataset:
  midi_loader:
    reader:
      subdivision: 12
      allowed_tick_offsets: [0, 3, 4, 6, 8, 9]
      # One-column sources have 24 ticks per beat; retain rows 0, 2, 4, ...
      one_column_tick_stride: 2

model:
  chord_duration_bins: 48
