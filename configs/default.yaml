defaults:
  - _self_

stage: train
device: cuda:1
seed: 42

output:
  root: outputs
  project_name: airpiano
  dir: ${output.root}/${output.project_name}

data:
  midi_root: /storage/jinxuan/data/AirPianoFull/MIDI
  video_root: /storage/jinxuan/data/AirPianoFull/Video
  raw_wilor_root: /storage2/jinxuan/data/AirPianoFull/wilor
  hand_root: /storage2/jinxuan/data/AirPianoFull/hands_default
  beat_root: /storage2/jinxuan/data/AirPianoFull/beats
  splits:
    train: splits/default_train.txt
    valid: splits/default_valid.txt
    test: splits/default_test.txt

preprocess:
  task: ragged_to_canonical
  split_files:
    - ${data.splits.train}
    - ${data.splits.valid}
    - ${data.splits.test}
  overwrite: false
  video_to_ragged:
    _target_: airpiano.preprocessing.video.VideoToWiLoR
    wilor_repo: third_party/WiLoR
    checkpoint: assets/wilor/wilor_final.ckpt
    model_config: ${preprocess.video_to_ragged.wilor_repo}/pretrained_models/model_config.yaml
    detector_checkpoint: assets/wilor/detector.pt
    mano_model: assets/mano/MANO_RIGHT.pkl
    mano_mean_params: ${preprocess.video_to_ragged.wilor_repo}/mano_data/mano_mean_params.npz
    device: ${device}
  ragged_to_canonical:
    _target_: airpiano.preprocessing.canonical.WiLoRToCanonical
    target_fps: ${dataset.fps}

dataset:
  fps: 30.0
  augmenter:
    _target_: airpiano.data.augmentation.WindowAugmenter
    random_hand_shift_seconds: 0.5
    random_pitch_shift_semitones: 6
    random_duration_scale_factors: [0.5, 1.0, 2.0]
  tokenizer:
    _target_: airpiano.data.tokenization.ChordTokenizer
    chord_duration_bins: ${model.chord_duration_bins}
  file_loader:
    _target_: airpiano.data.files.FileLoader
    pairer:
      _target_: airpiano.data.files.RelativeStemPairer
    reader:
      _target_: airpiano.data.files.EagerSongReader
  midi_loader:
    _target_: airpiano.data.midi.MidiLoader
    reader:
      _target_: airpiano.data.midi.MidoNoteReader
      subdivision: 24
      allowed_tick_offsets: [0, 3, 4, 6, 8, 9, 12, 15, 16, 18, 20, 21]
    chord_merger:
      _target_: airpiano.data.midi.InitializerChordMerger
  hand_loader:
    _target_: airpiano.data.hands.HandLoader
    reader:
      _target_: airpiano.data.hands.CanonicalNpzReader
    transform:
      _target_: airpiano.data.hands.OffsetScaleTransform
      offset: [0.0, 0.0, 0.0]
      scale: [10.0, 10.0, 10.0]
  slicer:
    _target_: airpiano.data.slicing.FutureChordSlicer
    segment_frames: 50
    stride_frames: 12
    max_zero_hand_fraction: 0.2
  target_generator:
    _target_: airpiano.data.targets.TargetGenerator
    event_generator:
      _target_: airpiano.data.targets.ChordOnsetEvents
    softener:
      _target_: airpiano.data.targets.TriangularSoftener
      radius_seconds: 0.2

model:
  _target_: airpiano.model.transformer.AirPianoTransformer
  chord_duration_bins: 96

train:
  epochs: 20
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_fraction: 0.05
  bf16: true

test:
  split_file: ${data.splits.test}
  checkpoint: ${output.dir}/checkpoints/last.pt
  output_dir: ${output.dir}/test

full_song_real_time:
  split_file: splits/air_tabletop.txt
  checkpoint: ${output.dir}/checkpoints/last.pt
  output_dir: ${output.dir}/full_song_real_time

wandb:
  project: air_piano
  name: ${output.project_name}
  entity: null
  dir: ${output.dir}/logs

visualize:
  root: ${full_song_real_time.output_dir}

sonify:
  root: ${full_song_real_time.output_dir}
  midi_root: ${data.midi_root}

evaluation:
  root: ${full_song_real_time.output_dir}
  output_path: ${evaluation.root}.json
  tolerances_frames: [4, 8, 16]
  summary_only: false

hydra:
  run:
    dir: ${output.dir}
