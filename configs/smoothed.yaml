defaults:
  - baseline
  - _self_

output:
  project_name: smoothed

data:
  hand_root: ${data.processed_root}/airpiano_wilor_2p5d_smoothed_30fps

preprocess:
  ragged_to_canonical:
    selector:
      _target_: airpiano.preprocessing.canonical.LowestWristHandSelector
      minimum_detector_confidence: 0.75
    postprocessor:
      _target_: airpiano.preprocessing.canonical.PianoMotion10MPostprocessor
      hampel_window_frames: 20
      hampel_n_sigma: 3.0
      max_missing_run_frames: 29
      min_presence_run_frames: 15
      savgol_window_frames: 11
      savgol_polyorder: 3
    minimum_presence: 0.90
