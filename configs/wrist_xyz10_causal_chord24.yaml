defaults:
  - wrist_xyz10
  - _self_

output:
  project_name: wrist_xyz10_causal_chord24

dataset:
  slicer:
    mode: chord
    # In chord mode these values count chord tokens; chord_count is ignored.
    segment_frames: 24
    stride_frames: 12

model:
  causal_frame_attention: true

full_song:
  split_file: assets/splits/pianomotion10mseg_valid.txt
  checkpoint: ${output.dir}/checkpoints/last.pt
  output_dir: ${output.dir}/full_song
  overwrite: false
  alignment_threshold: 0.2
  advance_after_chords: ${dataset.slicer.stride_frames}

evaluation:
  root: ${full_song.output_dir}
  output_path: ${evaluation.root}.json
  onset_threshold: ${sonify.threshold}
  tolerances_frames: [0, 2, 4, 8, 16]
  remove_inference_artifacts: false
